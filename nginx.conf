server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml font/woff2;

    # Cache static assets
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # HTML and Manifest without aggressive caching
    location ~* \.(html|webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
