<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2127"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#e4531a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e4531a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#2c333b" stroke-width="4"/>
  
  <!-- Stylized Hexagon Shield / Dumbbell Core -->
  <g transform="translate(256,256) scale(1.15)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="-110" y="-12" width="220" height="24" rx="12" fill="#eceff2"/>
    
    <!-- Outer Plates Left -->
    <rect x="-135" y="-75" width="22" height="150" rx="7" fill="url(#accent)"/>
    <rect x="-105" y="-55" width="18" height="110" rx="6" fill="#88929b"/>
    <rect x="-148" y="-40" width="12" height="80" rx="4" fill="#667078"/>
    
    <!-- Outer Plates Right -->
    <rect x="113" y="-75" width="22" height="150" rx="7" fill="url(#accent)"/>
    <rect x="87" y="-55" width="18" height="110" rx="6" fill="#88929b"/>
    <rect x="136" y="-40" width="12" height="80" rx="4" fill="#667078"/>
    
    <!-- Center Grip with Knurling details -->
    <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#e4531a"/>
    <line x1="-30" y1="-15" x2="-30" y2="15" stroke="#12151a" stroke-width="2"/>
    <line x1="-15" y1="-15" x2="-15" y2="15" stroke="#12151a" stroke-width="2"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#12151a" stroke-width="2"/>
    <line x1="15" y1="-15" x2="15" y2="15" stroke="#12151a" stroke-width="2"/>
    <line x1="30" y1="-15" x2="30" y2="15" stroke="#12151a" stroke-width="2"/>
    
    <!-- Lightning / Peak Badge -->
    <path d="M-8,-48 L14,-48 L4,-28 L18,-28 L-14,0 L-4,-20 L-16,-20 Z" fill="#ffb088" opacity="0.9"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="415" font-family="'Barlow Condensed', 'Impact', sans-serif" font-size="52" font-weight="700" fill="#eceff2" letter-spacing="4" text-anchor="middle">IRONLOG</text>
</svg>
