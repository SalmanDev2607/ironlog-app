  <style>
/* IronLog Modern Athletic UI Theme */

:root {
  --bg: #12151a;
  --cd: #1c2127;
  --cd-hover: #232932;
  --tx: #eceff2;
  --mu: #98a2ab;
  --ac: #ff7a3d;
  --ac-hover: #ff915b;
  --ax: #1a0e06;
  --bd: #2c333b;
  --rd: #ef7676;
  --rd-bg: rgba(239, 118, 118, 0.15);
  --yl: #e8b34a;
  --yl-bg: rgba(232, 179, 74, 0.15);
  --gn: #6fcf76;
  --gn-bg: rgba(111, 207, 118, 0.15);
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  --radius: 12px;
  --radius-sm: 8px;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f4f6f3;
  --cd: #ffffff;
  --cd-hover: #f9faf8;
  --tx: #161a1f;
  --mu: #616e78;
  --ac: #e4531a;
  --ac-hover: #c94411;
  --ax: #ffffff;
  --bd: #dce1dc;
  --rd: #c62828;
  --rd-bg: rgba(198, 40, 40, 0.1);
  --yl: #b7791f;
  --yl-bg: rgba(183, 121, 31, 0.1);
  --gn: #2e7d32;
  --gn-bg: rgba(46, 125, 50, 0.1);
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Barlow', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-weight: 500;
  line-height: 1.45;
  min-height: 100vh;
}

body {
  max-width: 560px;
  margin: 0 auto;
  padding: env(safe-area-inset-top, 14px) 16px calc(90px + env(safe-area-inset-bottom, 16px));
}

/* Typography */
h1, h2, h3, h4 {
  font-family: 'Barlow Condensed', Impact, -apple-system, sans-serif;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

h1 { font-size: 32px; line-height: 1.1; }
h2 { font-size: 24px; line-height: 1.15; }
h3 { font-size: 19px; line-height: 1.2; }
h4 { font-size: 16px; line-height: 1.25; }

.mu {
  color: var(--mu);
  font-size: 14px;
}

.mu-sm {
  color: var(--mu);
  font-size: 12px;
}

/* Layout Utilities */
.r {
  display: flex;
  gap: 8px;
  align-items: center;
}

.sb {
  justify-content: space-between;
}

.c-center {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.gr {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.gr-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

/* Cards */
.c {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 16px;
  margin: 12px 0;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, border-color 0.15s ease;
}

.c-highlight {
  border-color: var(--ac);
  background: linear-gradient(180deg, rgba(228, 83, 26, 0.06) 0%, var(--cd) 100%);
}

/* Header Bar */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 16px;
  border-bottom: 1px solid var(--bd);
  margin-bottom: 14px;
}

.app-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-logo {
  width: 34px;
  height: 34px;
  border-radius: 8px;
}

.app-actions {
  display: flex;
  gap: 6px;
}

/* Buttons */
button {
  font-family: 'Barlow', system-ui, sans-serif;
  font-size: 15px;
  font-weight: 600;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  background: var(--ac);
  color: var(--ax);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
  user-select: none;
}

button:hover {
  background: var(--ac-hover);
}

button:active {
  transform: scale(0.97);
}

button.g {
  background: transparent;
  color: var(--tx);
  border: 1px solid var(--bd);
}

button.g:hover {
  background: var(--cd-hover);
  border-color: var(--mu);
}

button.w {
  width: 100%;
  font-size: 18px;
  padding: 14px;
  font-family: 'Barlow Condensed', Impact, sans-serif;
  letter-spacing: 0.5px;
}

button.danger {
  background: var(--rd);
  color: #fff;
}

button.danger-outline {
  background: transparent;
  color: var(--rd);
  border: 1px solid var(--rd);
}

button.sm {
  padding: 6px 10px;
  font-size: 13px;
}

button.icon-btn {
  padding: 8px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid var(--bd);
  color: var(--tx);
  min-width: 36px;
  height: 36px;
}

/* Inputs & Form Controls */
input, select, textarea {
  font-family: 'Barlow', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--bd);
  background: var(--bg);
  color: var(--tx);
  outline: none;
  transition: border-color 0.15s ease;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--ac);
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--mu);
  margin: 10px 0 4px;
}

/* Input Stepper (+ and - buttons) */
.input-stepper {
  display: flex;
  align-items: center;
  gap: 4px;
}

.input-stepper button {
  width: 36px;
  height: 42px;
  padding: 0;
  font-size: 18px;
  background: var(--cd-hover);
  border: 1px solid var(--bd);
  color: var(--tx);
  flex-shrink: 0;
}

.input-stepper input {
  text-align: center;
}

/* Bottom Navigation */
nav#nv {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 560px;
  margin: 0 auto;
  background: var(--cd);
  border-top: 1px solid var(--bd);
  display: flex;
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  backdrop-filter: blur(10px);
}

nav#nv button {
  flex: 1;
  background: none;
  color: var(--mu);
  border-radius: 0;
  padding: 10px 2px 8px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  border-top: 2px solid transparent;
  transition: all 0.15s ease;
}

nav#nv button.on {
  color: var(--ac);
  border-top: 2px solid var(--ac);
  background: rgba(228, 83, 26, 0.05);
}

nav#nv button svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
}

/* Badges & Chips */
.t {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 8px;
  border-radius: 99px;
  border: 1px solid var(--bd);
  color: var(--mu);
}

.t-ac {
  border-color: var(--ac);
  color: var(--ac);
  background: rgba(228, 83, 26, 0.1);
}

.t-gn {
  border-color: var(--gn);
  color: var(--gn);
  background: var(--gn-bg);
}

.t-yl {
  border-color: var(--yl);
  color: var(--yl);
  background: var(--yl-bg);
}

.t-rd {

// Muscle group definitions
const MUSCLE_GROUPS = [
  'chest', 'shoulders', 'triceps', 'back', 'biceps',
  'quads', 'hamstrings', 'glutes', 'calves', 'abs', 'forearms'
];

// Mapping from muscle group to Golden Ratio body part measurement key
const MUSCLE_TO_MEASUREMENT = {
  chest: 'chest',
  shoulders: 'shoulders',
  back: 'shoulders',
  triceps: 'bicep',
  biceps: 'bicep',
  quads: 'thigh',
  hamstrings: 'thigh',
  glutes: 'hips',
  calves: 'calf'
};

// Target Golden-era aesthetic proportions relative to standing height (height * ratio)
const GOLDEN_RATIOS = {
  m: {
    chest: 0.53,
    shoulders: 0.62,
    bicep: 0.19,
    hips: 0.54,
    thigh: 0.32,
    calf: 0.21
  },
  f: {
    chest: 0.50,
    shoulders: 0.55,
    bicep: 0.16,
    hips: 0.58,
    thigh: 0.33,
    calf: 0.21
  }
};

const MEASUREMENT_KEYS = ['chest', 'shoulders', 'bicep', 'waist', 'hips', 'thigh', 'calf'];

// Workout Splits & Routine Templates
const WORKOUT_SPLITS = [
  ['Push A', ['bp', 'sp', 'ip', 'lr', 'pd', 'cc']],
  ['Pull A', ['lt', 'br', 'fp', 'bc', 'hc', 'wc']],
  ['Legs A', ['sq', 'rd', 'lc', 'cf']],
  ['Push B', ['ip', 'sp', 'lr', 'oe', 'pd', 'hl']],
  ['Pull B', ['cr', 'lt', 'fp', 'hc', 'bc', 'wc']],
  ['Legs B', ['lp', 'ht', 'rd', 'cf']],
  ['Upper Body A', ['bp', 'br', 'sp', 'lt', 'sk_crusher', 'bc']],
  ['Lower Body A', ['sq', 'rd', 'lp', 'lc', 'cf', 'hl']],
  ['Upper Body B', ['ibp', 'cr', 'dsp', 'pu_pull', 'pd', 'hc']],
  ['Lower Body B', ['hack_sq', 'ht', 'le', 'db_rdl', 'seated_cf', 'cc']],
  ['Full Body', ['sq', 'bp', 'br', 'sp', 'rd', 'cc']],
  ['Chest & Triceps', ['bp', 'ip', 'cfly', 'cdp', 'pd', 'sk_crusher']],
  ['Back & Biceps', ['dl', 'lt', 'tbr', 'cr', 'bc', 'hc']],
  ['Shoulders & Arms', ['sp', 'lr', 'fp', 'bc', 'pd', 'hc', 'oe']],
  ['Legs & Abs', ['sq', 'lp', 'rd', 'lc', 'cf', 'hl', 'ab_wheel']]
];

/**
 * Calculates current proportion score (ratio of actual to golden target)
 */
function getMuscleScore(muscle, state) {
  if (!state || !state.p || !state.m || !state.m.length) return null;
  const lastM = state.m[state.m.length - 1].v;
  if (!lastM) return null;
  const k = MUSCLE_TO_MEASUREMENT[muscle];
  if (!k) return null;
  const gender = state.p.g === 'f' ? 'f' : 'm';
  const ratio = GOLDEN_RATIOS[gender][k];
  if (!ratio || !state.p.h) return null;
  const target = state.p.h * ratio;
  return lastM[k] / target;
}

/**
 * Calculates recovery status of a muscle group based on hours since last intense session (>=3 sets)
 * Returns { status: 'red'|'yellow'|'green', label: 'Recovering'|'Almost ready'|'Ready', hours: number }
 */
function getMuscleRecovery(muscle, state, exercisesDict = DEFAULT_EXERCISES) {
  if (!state || !state.s || !state.s.length) {
    return { status: 'green', label: 'Ready', hours: 999 };
  }

  for (let i = state.s.length - 1; i >= 0; i--) {
    const session = state.s[i];
    if (!session || !session.sets) continue;
    const setsForMuscle = session.sets.filter(s => {
      const ex = exercisesDict[s.ex] || state.customExercises?.[s.ex];
      return ex && ex.primary === muscle;
    });

    if (setsForMuscle.length >= 3) {
      const hours = (Date.now() - session.end) / (3600 * 1000);
      if (hours < 36) {
        return { status: 'red', label: 'Recovering', hours: Math.round(hours) };
      } else if (hours < 56) {
        return { status: 'yellow', label: 'Almost ready', hours: Math.round(hours) };
      } else {
        return { status: 'green', label: 'Ready', hours: Math.round(hours) };
      }
    }
  }

  return { status: 'green', label: 'Ready', hours: 999 };
}

/**
 * Determines target sets for today based on lag status & priority
 */
function getTargetSets(muscle, state) {
  const score = getMuscleScore(muscle, state);
  let baseSets = 3;
  if (score !== null) {
    if (score < 0.93) {
      baseSets = 4; // Below golden target: overload volume
    } else if (score >= 1.02) {
      baseSets = 2; // At or above target: maintenance volume
    } else {
      baseSets = 3;
    }
  }

  const priorityList = state?.p?.pri || [];
  if (priorityList.includes(muscle)) {
    baseSets += 1; // User selected priority muscle
  }

  return baseSets;
}

/**
 * Calculates suggested starting weight for an exercise
 */
function getSuggestedWeight(exId, state, exercisesDict = DEFAULT_EXERCISES) {
  if (!state) return 0;
  // Check previous logged sets for this exercise
  if (state.s && state.s.length) {
    for (let i = state.s.length - 1; i >= 0; i--) {
      const match = state.s[i].sets?.filter(s => s.ex === exId).pop();
      if (match && match.w) return match.w;
    }
  }

  // Fallback to bodyweight formula
  const ex = exercisesDict[exId] || state.customExercises?.[exId];
  if (!ex || !ex.weightFactor) return 0;

  const latestWeight = state.w && state.w.length ? state.w[state.w.length - 1].w : (state.p?.w || 70);
  const genderMultiplier = state.p?.g === 'f' ? 0.65 : 1.0;
  const estimated = latestWeight * ex.weightFactor * genderMultiplier;
  
  // Round to nearest 1.25kg, minimum 2.5kg
  return Math.max(2.5, Math.round(estimated / 1.25) * 1.25);
}

  hapticsEnabled: true,
  customExercises: {}
};

let AppState = { ...DEFAULT_STATE };

/**
 * Returns ISO date string 'YYYY-MM-DD' for today (local time)
 */
function getTodayDate() {
  return new Date().toLocaleDateString('en-CA');
}

/**
 * Loads state from localStorage
 */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      AppState = {
        ...DEFAULT_STATE,
        ...parsed,
        // Ensure default settings exist if migrating from old version
        u: parsed.u || 'cm',
        wu: parsed.wu || 'kg',
        theme: parsed.theme || 'dark',
        restTimerDuration: parsed.restTimerDuration || 90,
        soundEnabled: parsed.soundEnabled ?? true,
        hapticsEnabled: parsed.hapticsEnabled ?? true,
        customExercises: parsed.customExercises || {}
      };
    } else {
      AppState = { ...DEFAULT_STATE };
    }
  } catch (err) {
    console.error('Failed to load state from localStorage:', err);
    AppState = { ...DEFAULT_STATE };
  }
  return AppState;
}

let onSaveListener = null;

function setOnSaveListener(fn) {
  onSaveListener = fn;
}

/**
 * Saves current state to localStorage
 */
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
    if (onSaveListener) onSaveListener();
  } catch (err) {
    console.error('Failed to persist state to localStorage:', err);
  }
}

/**
 * Returns reference to current AppState
 */
function getState() {
  return AppState;
}

/**
 * Gets the most recent recorded body weight in kg
 */
function getLatestWeight() {
  if (AppState.w && AppState.w.length > 0) {
    return AppState.w[AppState.w.length - 1].w;
  }
  return AppState.p ? AppState.p.w : 70;
}

/**
 * Unit Conversion Helpers
 */
function formatWeight(kgVal, unit = AppState.wu) {
  if (kgVal == null || isNaN(kgVal)) return '--';
  if (unit === 'lbs') {
    return (kgVal * 2.20462).toFixed(1);
  }
  return Number(kgVal).toFixed(1);
}

function parseWeightInput(inputVal, unit = AppState.wu) {
  const val = parseFloat(inputVal);
  if (isNaN(val) || val <= 0) return null;
  if (unit === 'lbs') {
    return +(val / 2.20462).toFixed(2);
  }
  return +val.toFixed(2);
}

function formatLength(cmVal, unit = AppState.u) {
  if (cmVal == null || isNaN(cmVal)) return '--';
  if (unit === 'in') {
    return (cmVal / 2.54).toFixed(1);
  }
  return Number(cmVal).toFixed(1);
}

function parseLengthInput(inputVal, unit = AppState.u) {
  const val = parseFloat(inputVal);
  if (isNaN(val) || val <= 0) return null;
  if (unit === 'in') {
    return +(val * 2.54).toFixed(1);
  }
  return +val.toFixed(1);
}

/**
 * Recalculates 1-month future projection based on current measurements, goal, and experience level
 */
function updateProjection() {
  if (!AppState.p || !AppState.m.length) return;
  const lastM = AppState.m[AppState.m.length - 1].v;
  if (!lastM) return;

  const baseGainRates = { b: 0.006, i: 0.003, a: 0.0015 };
  let rate = (baseGainRates[AppState.p.l] || 0.003) * (AppState.p.o === 'lose' ? 0.5 : 1.0);

  const expected = {};
  MEASUREMENT_KEYS.forEach(k => {
    const muscle = MUSCLE_GROUPS.find(m => MUSCLE_TO_MEASUREMENT[m] === k);
    const score = muscle ? getMuscleScore(muscle, AppState) : 1;
    const isPriority = (AppState.p.pri || []).some(m => MUSCLE_TO_MEASUREMENT[m] === k);
    const lagBoost = (score && score < 0.93) || isPriority ? 1.5 : 1.0;

    if (k === 'waist') {
      expected[k] = +(lastM[k] * (AppState.p.o === 'lose' ? 0.985 : 1.003)).toFixed(2);
    } else {
      expected[k] = +(lastM[k] * (1 + rate * lagBoost)).toFixed(2);
    }
  });

  // Extrapolate weight trend over past 14 days
  const w = AppState.w;
  let weightChangeForecast = 0;
  if (w && w.length >= 7) {
    const diff = w[w.length - 1].w - w[Math.max(0, w.length - 14)].w;
    const days = Math.max(1, Math.min(13, w.length - 1));
    weightChangeForecast = (diff / days) * 30;
  } else {
    weightChangeForecast = { gain: 0.8, lose: -2.0, both: 0.0 }[AppState.p.o] || 0;
  }

  const currentW = getLatestWeight();
  AppState.pr = {
    d: getTodayDate(),
    e: expected,
    wt: +(currentW + weightChangeForecast).toFixed(1)
  };
}

/**
 * Export full state as JSON file
 */

  const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(AppState, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute('href', dataStr);
  downloadAnchor.setAttribute('download', `ironlog-backup-${getTodayDate()}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

/**
 * Import state from JSON string
 */
function importStateJson(jsonString) {
  try {
    const parsed = JSON.parse(jsonString);
    if (!parsed || typeof parsed !== 'object') {
      throw new Error('Invalid JSON format');
    }
    // Verify core structure
    if (!('p' in parsed) && !('w' in parsed)) {
      throw new Error('File does not appear to be an IronLog backup');
    }
    AppState = {
      ...DEFAULT_STATE,
      ...parsed
    };
    saveState();
    return { success: true };
  } catch (err) {
    return { success: false, error: err.message };
  }
}

/**
 * Export completed workouts as CSV
 */
function exportWorkoutsCsv(exercisesDict) {
  if (!AppState.s || !AppState.s.length) {
    return false;
  }

  const rows = [['Date', 'Workout', 'Duration (min)', 'Exercise', 'Weight (kg)', 'Weight (lbs)', 'Reps']];
  AppState.s.forEach(session => {
    const duration = Math.round((session.end - session.start) / 60000);
    session.sets.forEach(set => {
      const exName = exercisesDict[set.ex]?.name || AppState.customExercises?.[set.ex]?.name || set.ex;
      const wKg = set.w;
      const wLbs = +(set.w * 2.20462).toFixed(1);
      rows.push([session.d, `"${session.n}"`, duration, `"${exName}"`, wKg, wLbs, set.r]);
    });
  });

  const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(r => r.join(',')).join('\n');
  const anchor = document.createElement('a');
  anchor.setAttribute('href', encodeURI(csvContent));
  anchor.setAttribute('download', `ironlog-workouts-${getTodayDate()}.csv`);
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  return true;
}

/**
 * Reset all state back to clean slate
 */
function resetState() {
  localStorage.removeItem(STORAGE_KEY);
  AppState = { ...DEFAULT_STATE };
}

// IronLog Timer & Sound Synthesizer (Zero External Dependencies)



let restTimerInterval = null;
let restTimeRemaining = 0;
let restTotalDuration = 90;
let isRestPaused = false;
let onRestTickCallback = null;
let onRestCompleteCallback = null;

// Web Audio API context for zero-asset chime
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

/**
 * Play a double chime sound when timer completes
 */
function playChime() {
  const state = getState();
  if (!state.soundEnabled) return;

  try {
    const ctx = getAudioContext();
    if (!ctx) return;

    const playTone = (freq, startTime, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);

      // Smooth attack and decay envelope
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.3, startTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration);
    };

    const now = ctx.currentTime;
    playTone(659.25, now, 0.25);        // E5
    playTone(880.00, now + 0.15, 0.45); // A5
  } catch (err) {
    console.warn('Audio playback error:', err);
  }
}

/**
 * Trigger haptic vibration if supported
 */
function triggerHaptic(pattern = [200, 80, 200]) {
  const state = getState();
  if (!state.hapticsEnabled) return;

  if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
    try {
      navigator.vibrate(pattern);
    } catch (e) {}
  }
}

/**
 * Start or reset the rest timer
 */
function startRestTimer(seconds, onTick, onComplete) {
  stopRestTimer();
  restTotalDuration = seconds || getState().restTimerDuration || 90;
  restTimeRemaining = restTotalDuration;
  isRestPaused = false;
  onRestTickCallback = onTick;
  onRestCompleteCallback = onComplete;

  // First callback immediately
  if (onRestTickCallback) {
    onRestTickCallback(restTimeRemaining, restTotalDuration);
  }

  restTimerInterval = setInterval(() => {
    if (isRestPaused) return;

    restTimeRemaining--;
    if (onRestTickCallback) {
      onRestTickCallback(restTimeRemaining, restTotalDuration);
    }

    if (restTimeRemaining <= 0) {
      stopRestTimer();
      playChime();
      triggerHaptic([250, 100, 250, 100, 400]);
      if (onRestCompleteCallback) {
        onRestCompleteCallback();
      }
    }
  }, 1000);
}

/**
 * Pause or resume rest timer
 */
function togglePauseRestTimer() {
  isRestPaused = !isRestPaused;
  return isRestPaused;
}

/**
 * Add or subtract seconds to current rest timer
 */
function adjustRestTimer(deltaSeconds) {
  if (restTimerInterval) {
    restTimeRemaining = Math.max(0, restTimeRemaining + deltaSeconds);
    restTotalDuration = Math.max(restTimeRemaining, restTotalDuration + deltaSeconds);
    if (onRestTickCallback) {
      onRestTickCallback(restTimeRemaining, restTotalDuration);
    }
  }
}

/**
 * Stop and dismiss rest timer
 */
function stopRestTimer() {
  if (restTimerInterval) {
    clearInterval(restTimerInterval);
    restTimerInterval = null;
  }
  restTimeRemaining = 0;
  isRestPaused = false;
}

function isRestTimerRunning() {
  return restTimerInterval !== null;
}

function getRestTimeRemaining() {
  return restTimeRemaining;
}

/**
 * Formats seconds into M:SS string
 */
function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// --- supabase.js ---
// IronLog Supabase Client & Authentication Service

const CONFIG_STORAGE_KEY = 'il_supabase_config';

// Default Supabase project configuration (can be updated via UI settings or here)
const DEFAULT_SUPABASE_CONFIG = {
  url: 'https://meioyarhiguhjlbjjlkx.supabase.co',
  anonKey: 'sb_publishable_au1YcfxlMUhs2Gc6fFm32Q_rE3eO2Rq'
};

let supabaseClient = null;

/**
 * Returns current Supabase project URL and anon public key
 */
function getSupabaseConfig() {
  try {
    if (typeof localStorage !== 'undefined') {
      const stored = localStorage.getItem(CONFIG_STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed.url && parsed.anonKey) return parsed;
      }
    }
  } catch (err) {
    console.warn('Failed to read Supabase config from storage:', err);
  }
  return { ...DEFAULT_SUPABASE_CONFIG };
}

/**
 * Updates Supabase credentials in local storage and re-initializes client
 */
function setSupabaseConfig(url, anonKey) {
  const cleanUrl = (url || '').trim().replace(/\/+$/, '');
  const cleanKey = (anonKey || '').trim();
  
  if (typeof localStorage !== 'undefined') {
    if (!cleanUrl || !cleanKey) {
      localStorage.removeItem(CONFIG_STORAGE_KEY);
    } else {
      localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify({ url: cleanUrl, anonKey: cleanKey }));
    }
  }
  
  supabaseClient = null; // force re-init
  return getClient();
}

/**
 * Checks whether Supabase credentials have been configured
 */
function isSupabaseConfigured() {
  const cfg = getSupabaseConfig();
  return Boolean(cfg.url && cfg.anonKey && cfg.url.startsWith('http'));
}

/**
 * Resolves createClient function from window.supabase or global supabase
 */
function resolveCreateClientFn() {
  if (typeof window !== 'undefined') {
    if (window.supabase?.createClient) return window.supabase.createClient;
    if (typeof supabase !== 'undefined' && supabase?.createClient) return supabase.createClient;
  }
  return null;
}

/**
 * Returns or initializes the Supabase client synchronously if library is ready
 */
function getClient() {
  if (supabaseClient) return supabaseClient;
  if (!isSupabaseConfigured()) return null;

  const createClientFn = resolveCreateClientFn();
  if (!createClientFn) return null;

  const cfg = getSupabaseConfig();
  try {
    supabaseClient = createClientFn(cfg.url, cfg.anonKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: 'implicit'
      }
    });
    return supabaseClient;
  } catch (err) {
    console.error('Error initializing Supabase client:', err);
    return null;
  }
}

/**
 * Ensures the Supabase client is initialized (with dynamic ESM fallback if script is delayed)
 */
export async function ensureClient() {
  if (supabaseClient) return supabaseClient;

  if (!isSupabaseConfigured()) {
    throw new Error('Supabase credentials are missing. Set project URL & Key in Settings.');
  }

  let createClientFn = resolveCreateClientFn();

  // If classic script not loaded, try dynamic ESM import from CDN
  if (!createClientFn) {
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      createClientFn = mod?.createClient || null;
      if (createClientFn && typeof window !== 'undefined') {
        window.supabase = mod;
      }
    } catch (err) {
      console.warn('Failed to load Supabase from ESM CDN:', err);
    }
  }

  if (!createClientFn) {
    throw new Error('Could not load Supabase SDK. Please check your internet connection.');
  }

  const cfg = getSupabaseConfig();
  try {
    supabaseClient = createClientFn(cfg.url, cfg.anonKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: 'implicit'
      }
    });
    return supabaseClient;
  } catch (err) {
    console.error('Error initializing Supabase client:', err);
    throw new Error('Failed to connect to Supabase: ' + err.message);
  }
}

/**
 * Signs up a user with email and password
 */
export async function signUpWithEmail(email, password) {
  const client = await ensureClient();
  const { data, error } = await client.auth.signUp({
    email,
    password
  });
  
  if (error) throw error;
  return data;
}

/**
 * Signs in with email and password
 */
export async function signInWithEmail(email, password) {
  const client = await ensureClient();
  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });
  
  if (error) throw error;
  return data;
}

/**
 * Initiates Google OAuth Sign-in flow
 */
export async function signInWithGoogle() {
  const client = await ensureClient();
  const redirectUrl = window.location.origin + window.location.pathname;
  const { data, error } = await client.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: redirectUrl
    }
  });
  
  if (error) throw error;
  return data;
}

/**
 * Signs out the current authenticated user
 */
export async function signOutUser() {
  const client = await ensureClient().catch(() => null);
  if (!client) return;
  const { error } = await client.auth.signOut();
  if (error) throw error;
}

/**
 * Retrieves the currently logged-in user
 */
export async function getCurrentUser() {
  const client = await ensureClient().catch(() => null);
  if (!client) return null;
  const { data: { user }, error } = await client.auth.getUser();
  if (error || !user) return null;
  return user;
}

/**
 * Retrieves the current session
 */
export async function getCurrentSession() {
  const client = await ensureClient().catch(() => null);
  if (!client) return null;
  const { data: { session }, error } = await client.auth.getSession();
  if (error || !session) return null;
  return session;
}

/**
 * Checks URL for recovery tokens / parameters, sets session explicitly,
 * and returns { isRecovery: boolean, error: string | null }.
 */
export async function handleRecoveryRedirect(customLocation) {
  if (typeof window === 'undefined' && !customLocation) return { isRecovery: false, error: null };

  const loc = customLocation || window.location;
  const rawHash = loc.hash || '';
  const hash = rawHash.startsWith('#') ? rawHash.substring(1) : rawHash;
  const hashParams = new URLSearchParams(hash);
  const searchParams = new URLSearchParams(loc.search || '');

  const type = hashParams.get('type') || searchParams.get('type');
  const accessToken = hashParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token');
  const code = searchParams.get('code');
  const errorDescription = hashParams.get('error_description') || searchParams.get('error_description');

  if (errorDescription) {
    if (typeof localStorage !== 'undefined') {
      localStorage.removeItem('il_awaiting_password_reset');
    }
    return { isRecovery: false, error: decodeURIComponent(errorDescription.replace(/\+/g, ' ')) };
  }

  // Recovery is detected if:
  // 1. type === 'recovery' in hash or query
  // 2. OR user had requested a password reset in this browser and arrives with access_token or code
  const awaitingReset = typeof localStorage !== 'undefined' && localStorage.getItem('il_awaiting_password_reset') === 'true';
  const isRecovery = type === 'recovery' || (awaitingReset && (Boolean(accessToken) || Boolean(code)));

  if (!isRecovery) return { isRecovery: false, error: null };

  // Clear awaiting flag now that we caught the recovery
  if (typeof localStorage !== 'undefined') {
    localStorage.removeItem('il_awaiting_password_reset');
  }

  try {
    const client = await ensureClient();
    if (client) {
      if (accessToken) {
        await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken || ''
        });
      } else if (code && typeof client.auth.exchangeCodeForSession === 'function') {
        await client.auth.exchangeCodeForSession(code);
      } else {
        await client.auth.getSession();
      }
    }
  } catch (err) {
    console.warn('Error establishing recovery session:', err);
  }

  // Clean URL tokens without page reload
  if (typeof window !== 'undefined' && window.history && window.history.replaceState) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  return { isRecovery: true, error: null };
}

/**
 * Sends a password reset email with a link back to the app
 */
export async function resetPasswordForEmail(email) {
  const client = await ensureClient();
  // Always redirect to the canonical app URL so the token domain matches
  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
  if (error) throw error;
}

/**
 * Updates the authenticated user's password (called after clicking reset link)
 */
export async function updatePassword(newPassword) {
  const client = await ensureClient();
  // Verify session exists before attempting update
  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    throw new Error('Auth session missing! Please click the reset link from your email again.');
  }
  const { error } = await client.auth.updateUser({ password: newPassword });
  if (error) throw error;
}

/**
 * Listens to authentication state changes (SIGNED_IN, SIGNED_OUT, etc.)
 */
function onAuthChange(callback) {
  const client = getClient();
  if (!client) {
    // If not ready yet, retry when client is ensured
    ensureClient().then(c => {
      if (c) {
        c.auth.onAuthStateChange((event, session) => {
          callback(event, session);
        });
      }
    }).catch(() => {});
    return { unsubscribe: () => {} };
  }
  
  const { data: { subscription } } = client.auth.onAuthStateChange((event, session) => {
    callback(event, session);
  });
  
  return subscription;
}

// IronLog Offline-First Cloud Synchronization Engine




const SYNC_STATUS = {
  UNCONFIGURED: 'unconfigured',
  GUEST: 'guest',
  SYNCING: 'syncing',
  SYNCED: 'synced',
  OFFLINE: 'offline',
  ERROR: 'error'
};

let currentSyncStatus = SYNC_STATUS.GUEST;
let statusChangeListeners = [];
let pushDebounceTimer = null;
let lastSyncedTime = null;
let currentUser = null;

/**
 * Register a listener for sync status updates
 */
function onSyncStatusChange(fn) {
  statusChangeListeners.push(fn);
  fn(currentSyncStatus, { user: currentUser, lastSynced: lastSyncedTime });
  return () => {
    statusChangeListeners = statusChangeListeners.filter(l => l !== fn);
  };
}

function setStatus(status) {
  currentSyncStatus = status;
  statusChangeListeners.forEach(fn => fn(currentSyncStatus, {
    user: currentUser,
    lastSynced: lastSyncedTime
  }));
}

function getSyncStatus() {
  return {
    status: currentSyncStatus,
    user: currentUser,
    lastSynced: lastSyncedTime,
    isConfigured: isSupabaseConfigured()
  };
}

/**
 * Merge remote state with local state without data loss
 */
function mergeStates(local, remote) {
  if (!remote) return local;
  if (!local) return remote;

  // 1. Merge completed workout sessions (union by start timestamp & date)
  const mergedSessions = [...(local.s || [])];
  const localSessionKeys = new Set(mergedSessions.map(s => `${s.d}_${s.start || s.n}`));

  (remote.s || []).forEach(remS => {
    const key = `${remS.d}_${remS.start || remS.n}`;
    if (!localSessionKeys.has(key)) {
      mergedSessions.push(remS);
      localSessionKeys.add(key);
    }
  });
  // Sort chronologically
  mergedSessions.sort((a, b) => (a.start || 0) - (b.start || 0));

  // 2. Merge weight history (by date, latest wins)
  const weightMap = new Map();
  (local.w || []).forEach(entry => weightMap.set(entry.d, entry));
  (remote.w || []).forEach(entry => {
    if (!weightMap.has(entry.d)) {
      weightMap.set(entry.d, entry);
    }
  });
  const mergedWeights = Array.from(weightMap.values()).sort((a, b) => a.d.localeCompare(b.d));

  // 3. Merge body measurements (by date)
  const measurementMap = new Map();
  (local.m || []).forEach(entry => measurementMap.set(entry.d, entry));
  (remote.m || []).forEach(entry => {
    if (!measurementMap.has(entry.d)) {
      measurementMap.set(entry.d, entry);
    }
  });
  const mergedMeasurements = Array.from(measurementMap.values()).sort((a, b) => a.d.localeCompare(b.d));

  // 4. Merge custom exercises
  const mergedCustom = {
    ...(remote.customExercises || {}),
    ...(local.customExercises || {})
  };

  // 5. Profile & Settings
  const profile = local.p || remote.p || null;
  const theme = local.theme || remote.theme || 'dark';
  const u = local.u || remote.u || 'cm';
  const wu = local.wu || remote.wu || 'kg';
  const restTimerDuration = local.restTimerDuration || remote.restTimerDuration || 90;

  return {
    ...DEFAULT_STATE,
    ...local,
    p: profile,
    s: mergedSessions,
    w: mergedWeights,
    m: mergedMeasurements,
    customExercises: mergedCustom,
    theme,
    u,
    wu,
    restTimerDuration
  };
}

/**
 * Pull latest user data from Supabase
 */
export async function pullFromCloud() {
  if (!navigator.onLine) {
    setStatus(SYNC_STATUS.OFFLINE);
    return false;
  }

  const client = getClient();
  if (!client || !currentUser) {
    setStatus(isSupabaseConfigured() ? SYNC_STATUS.GUEST : SYNC_STATUS.UNCONFIGURED);
    return false;
  }

  try {
    setStatus(SYNC_STATUS.SYNCING);

    const { data, error } = await client
      .from('user_data')
      .select('state, updated_at')
      .eq('user_id', currentUser.id)
      .maybeSingle();

    if (error) throw error;

    if (data && data.state) {
      const currentState = getState();
      const merged = mergeStates(currentState, data.state);
      
      // Update memory state
      Object.assign(currentState, merged);
      saveState(); // write to localStorage

      lastSyncedTime = new Date();
      setStatus(SYNC_STATUS.SYNCED);
      return true;
    } else {
      // First time cloud user: upload local guest data to cloud!
      await pushToCloud();
      return true;
    }
  } catch (err) {
    console.error('Failed to pull user data from Supabase:', err);
    setStatus(SYNC_STATUS.ERROR);
    return false;
  }
}

/**
 * Push local state to Supabase
 */
export async function pushToCloud() {
  if (!navigator.onLine) {
    setStatus(SYNC_STATUS.OFFLINE);
    return false;
  }

  const client = getClient();
  if (!client || !currentUser) return false;

  try {
    setStatus(SYNC_STATUS.SYNCING);
    const stateToSave = getState();

    const { error } = await client
      .from('user_data')
      .upsert({
        user_id: currentUser.id,
        state: stateToSave,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });

    if (error) throw error;

    lastSyncedTime = new Date();
    setStatus(SYNC_STATUS.SYNCED);
    return true;
  } catch (err) {
    console.error('Failed to push state to Supabase:', err);
    setStatus(SYNC_STATUS.ERROR);
    return false;
  }
}

/**
 * Schedule a debounced push (1.5 seconds)
 */
function scheduleDebouncedPush() {
  if (!currentUser || !isSupabaseConfigured()) return;
  if (!navigator.onLine) {
    setStatus(SYNC_STATUS.OFFLINE);
    return;
  }

  clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(() => {
    pushToCloud();
  }, 1500);
}

/**
 * Initialize sync listeners and auth state handling
 */
export async function initSync(onUpdateCallback, onPasswordRecovery) {
  // Wire auto-save hook
  setOnSaveListener(scheduleDebouncedPush);

  // Network connectivity listeners
  window.addEventListener('online', () => {
    if (currentUser) {
      pullFromCloud().then(() => onUpdateCallback?.());
    } else {
      setStatus(isSupabaseConfigured() ? SYNC_STATUS.GUEST : SYNC_STATUS.UNCONFIGURED);
    }
  });

  window.addEventListener('offline', () => {
    setStatus(SYNC_STATUS.OFFLINE);
  });

  if (!isSupabaseConfigured()) {
    setStatus(SYNC_STATUS.UNCONFIGURED);
    return;
  }

  try {
    currentUser = await getCurrentUser();
    if (currentUser) {
      await pullFromCloud();
      onUpdateCallback?.();
    } else {
      setStatus(SYNC_STATUS.GUEST);
    }
  } catch (err) {
    console.warn('Initial auth check notice:', err);
    setStatus(SYNC_STATUS.GUEST);
  }

  // Subscribe to auth events
  onAuthChange(async (event, session) => {
    // PASSWORD_RECOVERY: user clicked the reset link — show reset form, don't log in yet
    if (event === 'PASSWORD_RECOVERY') {
      currentUser = session?.user || null;
      if (onPasswordRecovery) onPasswordRecovery();
      return;
    }

    currentUser = session?.user || null;
    if (currentUser) {
      await pullFromCloud();
      onUpdateCallback?.();
    } else {
      setStatus(SYNC_STATUS.GUEST);
      onUpdateCallback?.();
    }
  });
}

// -------------------------------------------------------------
// Text Normalization & Keyword Extraction
// -------------------------------------------------------------

function normalizeQuery(text) {
  if (!text || typeof text !== 'string') return '';
  return text
    .toLowerCase()
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function extractKeywords(text) {
  const norm = normalizeQuery(text);
  if (!norm) return [];
  const words = norm.split(' ');
  const tokens = [];

  for (let w of words) {
    if (w.length <= 1) continue;
    if (STOP_WORDS.has(w)) continue;

    let stemmed = w;
    if (stemmed.endsWith('ing') && stemmed.length > 5) stemmed = stemmed.slice(0, -3);
    else if (stemmed.endsWith('ies') && stemmed.length > 4) stemmed = stemmed.slice(0, -3) + 'y';
    else if (stemmed.endsWith('es') && stemmed.length > 4 && stemmed !== 'united') stemmed = stemmed.slice(0, -2);
    else if (stemmed.endsWith('s') && !stemmed.endsWith('ss') && stemmed.length > 3 && stemmed !== 'this') stemmed = stemmed.slice(0, -1);
    else if (stemmed.endsWith('ed') && stemmed.length > 5 && stemmed !== 'united') stemmed = stemmed.slice(0, -2);

    tokens.push(stemmed);
  }

  return Array.from(new Set(tokens));
}

function getBigrams(text) {
  const norm = normalizeQuery(text).replace(/\s+/g, '');
  const bigrams = new Set();
  for (let i = 0; i < norm.length - 1; i++) {
    bigrams.add(norm.slice(i, i + 2));
  }
  return bigrams;
}

function calculateSimilarity(query1, query2, tokens1 = null, tokens2 = null) {
  const norm1 = normalizeQuery(query1);
  const norm2 = normalizeQuery(query2);

  if (norm1 === norm2) return 1.0;
  if (!norm1 || !norm2) return 0.0;

  // Conflicting timeframe check (e.g. today vs tomorrow vs day after tomorrow vs specific weekdays)
  const getTimeTag = (str) => {
    if (str.includes('day after tomorrow') || str.includes('in 2 days')) return 'day_after_tomorrow';
    if (str.includes('tomorrow') || str.includes('tommrow') || str.includes('tmrw') || str.includes('tomorow')) return 'tomorrow';
    if (str.includes('today')) return 'today';
    if (str.includes('yesterday')) return 'yesterday';
    for (const w of ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday']) {
      if (str.includes(w)) return w;
    }
    return null;
  };

  const isTime1 = getTimeTag(norm1);
  const isTime2 = getTimeTag(norm2);
  if (isTime1 && isTime2 && isTime1 !== isTime2) {
    return 0.1; // Mutually exclusive timeframes
  }

  // Conflicting muscle targets check (e.g. chest vs leg)
  const muscleGroups = ['chest', 'back', 'lat', 'shoulder', 'delt', 'bicep', 'tricep', 'quad', 'hamstring', 'glute', 'calf', 'abs', 'leg', 'legs', 'arm', 'arms'];
  const m1 = muscleGroups.find(m => norm1.includes(m));
  const m2 = muscleGroups.find(m => norm2.includes(m));
  if (m1 && m2 && m1 !== m2) {
    return 0.1; // Mutually exclusive muscle targets
  }

  if (norm1.includes(norm2) || norm2.includes(norm1)) {
    const minLen = Math.min(norm1.length, norm2.length);
    const maxLen = Math.max(norm1.length, norm2.length);
    if (minLen / maxLen >= 0.70) return 0.90;
  }

  const t1 = tokens1 || extractKeywords(query1);
  const t2 = tokens2 || extractKeywords(query2);

  if (t1.length === 0 || t2.length === 0) return 0.0;

  const s1 = new Set(t1);
  const s2 = new Set(t2);
  let intersection = 0;
  for (const item of s1) {
    if (s2.has(item)) intersection++;
  }

  const union = new Set([...t1, ...t2]).size;
  const jaccard = union > 0 ? intersection / union : 0;
  const minTokenLen = Math.min(s1.size, s2.size);
  const overlap = minTokenLen > 0 ? intersection / minTokenLen : 0;

  // Only allow overlap bonus if 2 or more distinct keywords match
  const multiTokenOverlap = intersection >= 2 ? (overlap * 0.7 + jaccard * 0.3) : jaccard;

  if (overlap === 1.0 && intersection >= 2) {
    return Math.max(0.85, 0.5 * jaccard + 0.5 * overlap);
  }

  const bg1 = getBigrams(norm1);
  const bg2 = getBigrams(norm2);
  let dice = 0;
  if (bg1.size > 0 && bg2.size > 0) {
    let matches = 0;
    for (const bg of bg1) {
      if (bg2.has(bg)) matches++;
    }
    dice = (2 * matches) / (bg1.size + bg2.size);
  }

  const lev = calculateLevenshteinRatio(norm1, norm2);

  return Math.max(
    multiTokenOverlap,
    jaccard * 0.6 + dice * 0.4,
    dice * 0.8 + lev * 0.2,
    lev
  );
}

function calculateLevenshteinRatio(s1, s2) {
  if (s1 === s2) return 1.0;
  const l1 = s1.length;
  const l2 = s2.length;
  if (l1 === 0 || l2 === 0) return 0.0;

  const maxLen = Math.max(l1, l2);
  const track = Array(l2 + 1).fill(null).map(() => Array(l1 + 1).fill(null));
  for (let i = 0; i <= l1; i += 1) track[0][i] = i;
  for (let j = 0; j <= l2; j += 1) track[j][0] = j;

  for (let j = 1; j <= l2; j += 1) {
    for (let i = 1; i <= l1; i += 1) {
      const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
      track[j][i] = Math.min(
        track[j][i - 1] + 1,
        track[j - 1][i] + 1,
        track[j - 1][i - 1] + indicator
      );
    }
  }

  const distance = track[l2][l1];
  return Math.max(0, 1 - distance / maxLen);
}

function isQueryInScope(query) {
  if (!query || typeof query !== 'string') return false;
  const norm = normalizeQuery(query);
  if (!norm) return false;

  // 1. Check explicit off-topic triggers
  for (const trigger of OFF_TOPIC_TRIGGERS) {
    if (norm.includes(trigger)) {
      const anchors = ['workout', 'hypertrophy', 'exercise', 'lifting', 'muscle', 'sets', 'reps', 'ironlog', 'rag'];
      if (!anchors.some(a => norm.includes(a))) {
        return false;
      }
    }
  }

  // 2. Greetings
  const greetings = ['hi', 'hello', 'hey', 'good morning', 'good afternoon', 'good evening', 'who are you', 'help', 'what can you do'];
  if (greetings.some(g => norm === g || norm.startsWith(g + ' ') || norm.endsWith(' ' + g))) {
    return true;
  }

  // 3. Check explicit scope keywords with word boundaries
  for (const kw of SCOPE_KEYWORDS) {
    const regex = new RegExp(`\\b${kw.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}\\b`, 'i');
    if (regex.test(norm)) {
      return true;
    }
  }

  // 4. Check token matches
  const tokens = extractKeywords(query);
  const scopeSet = new Set(SCOPE_KEYWORDS);
  if (tokens.some(t => scopeSet.has(t))) {
    return true;
  }

  return false;
}

// -------------------------------------------------------------
// RAG Retrieval Engine (BM25 + TF-IDF Vector Ranking)
// -------------------------------------------------------------

/**
 * Retrieve the most relevant knowledge base chunks for a query
 */
function retrieveRagChunks(query, topK = 3) {
  const qTokens = extractKeywords(query);
  if (qTokens.length === 0) {
    return IRONLOG_RAG_CORPUS.slice(0, topK);
  }

  const scoredChunks = IRONLOG_RAG_CORPUS.map(chunk => {
    let score = 0;
    const chunkTokens = extractKeywords(chunk.title + ' ' + chunk.content);
    const chunkTokenSet = new Set(chunkTokens);
    const keywordSet = new Set(chunk.keywords || []);

    for (const qt of qTokens) {
      // Direct keyword tag match (high weight)
      if (keywordSet.has(qt)) score += 4.0;
      // Title or content token match
      if (chunkTokenSet.has(qt)) score += 2.0;
    }

    // Substring match in title
    const normTitle = normalizeQuery(chunk.title);
    for (const qt of qTokens) {
      if (normTitle.includes(qt)) score += 3.0;
    }

    return { chunk, score };
  });

  scoredChunks.sort((a, b) => b.score - a.score);

  // Return topK chunks with non-zero scores, or first topK if none scored
  const positive = scoredChunks.filter(s => s.score > 0);
  if (positive.length > 0) {
    return positive.slice(0, topK).map(s => s.chunk);
  }
  return IRONLOG_RAG_CORPUS.slice(0, topK);
}

// Supabase pgvector Semantic Search & Embeddings
// -------------------------------------------------------------

/**
 * Generate embedding vector using Gemini (Free) or OpenAI
 */
export async function generateEmbedding(text, apiKey, provider = 'gemini') {
  if (!text || !apiKey) return null;

  try {
    if (provider === 'gemini') {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent?key=${apiKey.trim()}`;
      const payload = {
        model: 'models/text-embedding-004',
        content: { parts: [{ text: text.slice(0, 2000) }] }
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) return null;
      const data = await res.json();
      return data.embedding?.values || null;
    }

    if (provider === 'openai') {
      const url = 'https://api.openai.com/v1/embeddings';
      const payload = {
        model: 'text-embedding-3-small',
        input: text.slice(0, 2000),
        dimensions: 768
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey.trim()}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) return null;
      const data = await res.json();
      return data.data?.[0]?.embedding || null;
    }
  } catch (err) {
    console.warn('Embedding API error:', err.message);
  }

  return null;
}

/**
 * Query Supabase pgvector match_ironlog_documents RPC
 */
export async function searchSupabasePgVector(query, apiKey, provider = 'gemini', topK = 3) {
  try {
    const client = getClient();
    if (!client) return null;

    const queryEmbedding = await generateEmbedding(query, apiKey, provider);
    if (!queryEmbedding) return null;

    const { data, error } = await client.rpc('match_ironlog_documents', {
      query_embedding: queryEmbedding,
      match_threshold: 0.35,
      match_count: topK
    });

    if (error || !Array.isArray(data) || data.length === 0) {
      return null;
    }

    return data.map(row => ({
      id: row.id,
      title: row.title,
      category: row.category,
      content: row.content,
      similarity: row.similarity
    }));
  } catch (err) {
    console.warn('Supabase pgvector query bypassed:', err.message);
    return null;
  }
}

/**
 * Hybrid RAG Retrieval: Supabase pgvector when online, Local BM25 fallback when offline
 */
export async function retrieveHybridChunks(query, apiKey = '', provider = 'gemini', topK = 3) {
  if (apiKey && typeof navigator !== 'undefined' && navigator.onLine) {
    const vectorChunks = await searchSupabasePgVector(query, apiKey, provider, topK);
    if (vectorChunks && vectorChunks.length > 0) {
      return { chunks: vectorChunks, source: 'supabase-pgvector' };
    }
  }

  // Local in-memory BM25 retrieval
  return { chunks: retrieveRagChunks(query, topK), source: 'local-bm25' };
}

/**
 * Sync & embed the local corpus chunks into Supabase ironlog_rag_documents table
 */
export async function syncCorpusToSupabase(apiKey, provider = 'gemini', onProgress = null) {
  const client = getClient();
  if (!client) throw new Error('Supabase is not configured.');
  if (!apiKey) throw new Error('API key is required to generate vector embeddings.');

  let synced = 0;
  for (const chunk of IRONLOG_RAG_CORPUS) {
    if (onProgress) onProgress(synced + 1, IRONLOG_RAG_CORPUS.length, chunk.title);

    // Compute embedding for the chunk
    const embedding = await generateEmbedding(`${chunk.title}\n${chunk.content}`, apiKey, provider);

    const row = {
      id: chunk.id,
      title: chunk.title,
      category: chunk.category,
      content: chunk.content,
      embedding: embedding || null,
      updated_at: new Date().toISOString()
    };

    const { error } = await client
      .from('ironlog_rag_documents')
      .upsert(row, { onConflict: 'id' });

    if (error) {
      console.warn(`Failed to upsert chunk ${chunk.id}:`, error.message);
    } else {
      synced++;
    }
  }

  return { total: IRONLOG_RAG_CORPUS.length, synced };
}

/**
 * Call cloud LLM provider with RAG augmented prompt
 */
export async function callCloudLlm(ragPrompt, config) {
  const { provider, apiKey, model, customEndpoint } = config;
  if (!apiKey) {
    throw new Error('No API key configured');
  }

  // 1. Google Gemini API
  if (provider === 'gemini') {
    const targetModel = model || 'gemini-1.5-flash';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey.trim()}`;

    const payload = {
      contents: [
        {
          role: 'user',
          parts: [
            { text: ragPrompt.systemPrompt + '\n\n' + ragPrompt.userPrompt }
          ]
        }
      ],
      generationConfig: {
        temperature: 0.3,
        maxOutputTokens: 800
      }
    };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData.error ? errData.error.message : `Gemini HTTP ${res.status}`;
      throw new Error(msg);
    }

    const data = await res.json();
    const candidate = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!candidate) throw new Error('No response text returned from Gemini API.');
    return candidate.trim();
  }

  // 2. OpenAI / Compatible endpoint
  if (provider === 'openai' || provider === 'custom') {
    const endpoint = customEndpoint || 'https://api.openai.com/v1/chat/completions';
    const targetModel = model || 'gpt-4o-mini';

    const payload = {
      model: targetModel,
      temperature: 0.3,
      messages: [
        { role: 'system', content: ragPrompt.systemPrompt },
        { role: 'user', content: ragPrompt.userPrompt }
      ]
    };

    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey.trim()}`
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData.error ? errData.error.message : `OpenAI HTTP ${res.status}`;
      throw new Error(msg);
    }

    const data = await res.json();
    const candidate = data.choices?.[0]?.message?.content;
    if (!candidate) throw new Error('No response text returned from OpenAI API.');
    return candidate.trim();
  }

  throw new Error(`Unsupported AI provider: ${provider}`);
}

/**
 * Dynamically resolves workout schedule queries (today, tomorrow, day after tomorrow, specific weekdays)
 */
function resolveWorkoutScheduleQuery(query) {
  const norm = normalizeQuery(query);
  const scheduleWords = ['workout', 'routine', 'split', 'schedule', 'train', 'exercise', 'movement', 'plan'];
  if (!scheduleWords.some(w => norm.includes(w))) {
    return null;
  }

  const state = getState();
  const todayStr = getTodayDate();

  let targetIndex = null;
  let targetLabel = '';

  if (norm.includes('day after tomorrow') || norm.includes('in 2 days') || norm.includes('2 days from now')) {
    const targetDate = new Date(Date.now() + 2 * 86400000);
    const targetDay = targetDate.getDay();
    targetIndex = (targetDay + 6) % 7;
    const weekdayName = targetDate.toLocaleDateString(undefined, { weekday: 'long' });
    targetLabel = `The Day After Tomorrow (${weekdayName})`;
  } else if (norm.includes('tomorrow') || norm.includes('tommrow') || norm.includes('tomorow') || norm.includes('tmrw')) {
    const targetDate = new Date(Date.now() + 86400000);
    const targetDay = targetDate.getDay();
    targetIndex = (targetDay + 6) % 7;
    const weekdayName = targetDate.toLocaleDateString(undefined, { weekday: 'long' });
    targetLabel = `Tomorrow (${weekdayName})`;
  } else if (norm.includes('today') || norm.includes('current')) {
    const dayIndex = (new Date().getDay() + 6) % 7;
    targetIndex = (state.ov && state.ov.d === todayStr)
      ? (state.ov.i >= 0 ? state.ov.i : -1)
      : (dayIndex <= 5 ? dayIndex : -1);
    targetLabel = 'Today';
  } else {
    // Check specific weekdays
    const weekdays = [
      { name: 'monday', idx: 0 },
      { name: 'tuesday', idx: 1 },
      { name: 'wednesday', idx: 2 },
      { name: 'thursday', idx: 3 },
      { name: 'friday', idx: 4 },
      { name: 'saturday', idx: 5 },
      { name: 'sunday', idx: 6 }
    ];
    for (const w of weekdays) {
      if (norm.includes(w.name)) {
        targetIndex = w.idx;
        targetLabel = w.name.charAt(0).toUpperCase() + w.name.slice(1);
        break;
      }
    }
  }

  if (targetIndex === null) return null;

  if (targetIndex < 0 || targetIndex > 5 || !WORKOUT_SPLITS[targetIndex]) {
    return `📅 **${targetLabel} is scheduled as a Rest Day.**\n\nRest and recovery are when hypertrophy occurs. Hit your protein targets and sleep well.\n*Tip: You can use "Override Split" on the Today tab if you wish to train.*`;
  }

  const split = WORKOUT_SPLITS[targetIndex];
  const splitName = split[0];
  const exercises = (split[1] || []).map(id => DEFAULT_EXERCISES[id]?.name || id);

  return `🏋️ **${targetLabel}'s Scheduled Routine: ${splitName}**\n\n${exercises.map(name => `• **${name}**`).join('\n')}\n\n*Targeted movements for ${splitName}. Prepare to crush it!*`;
}

// Similarity Cache Storage & Retrieval
// -------------------------------------------------------------

function getChatCache() {
  try {
    const raw = localStorage.getItem(CACHE_STORAGE_KEY);
    if (!raw) return { version: 2, entries: [] };
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed.entries) ? parsed : { version: 2, entries: [] };
  } catch (err) {
    return { version: 2, entries: [] };
  }
}

function saveChatCache(cache) {
  try {
    if (cache.entries.length > MAX_CACHE_ENTRIES) {
      cache.entries.sort((a, b) => (b.lastHitAt || 0) - (a.lastHitAt || 0));
      cache.entries = cache.entries.slice(0, MAX_CACHE_ENTRIES);
    }
    localStorage.setItem(CACHE_STORAGE_KEY, JSON.stringify(cache));
  } catch (err) {
    console.warn('Failed to persist chat cache:', err);
  }
}

function findInCache(query) {
  const normQ = normalizeQuery(query);
  if (!normQ) return null;

  const cache = getChatCache();
  const qTokens = extractKeywords(query);

  let bestMatch = null;
  let highestSimilarity = 0;

  for (const entry of cache.entries) {
    if (entry.normQuery === normQ) {
      entry.hits = (entry.hits || 1) + 1;
      entry.lastHitAt = Date.now();
      saveChatCache(cache);
      return {
        entry,
        similarity: 1.0,
        isExact: true
      };
    }

    const sim = calculateSimilarity(query, entry.originalQuery, qTokens, entry.tokens);
    if (sim > highestSimilarity) {
      highestSimilarity = sim;
      bestMatch = entry;
    }
  }

  if (bestMatch && highestSimilarity >= SIMILARITY_THRESHOLD) {
    bestMatch.hits = (bestMatch.hits || 1) + 1;
    bestMatch.lastHitAt = Date.now();
    saveChatCache(cache);
    return {
      entry: bestMatch,
      similarity: highestSimilarity,
      isExact: false
    };
  }

  return null;
}

function putInCache(query, response, inScope = true, source = 'rag') {
  const normQ = normalizeQuery(query);
  if (!normQ) return;

  const cache = getChatCache();
  const tokens = extractKeywords(query);

  const existing = cache.entries.find(e => e.normQuery === normQ);
  if (existing) {
    existing.response = response;
    existing.inScope = inScope;
    existing.tokens = tokens;
    existing.source = source;
    existing.lastHitAt = Date.now();
  } else {
    cache.entries.push({
      id: 'cache_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      originalQuery: query.trim(),
      normQuery: normQ,
      tokens,
      response,
      inScope,
      source,
      hits: 1,
      createdAt: Date.now(),
      lastHitAt: Date.now()
    });
  }

  saveChatCache(cache);
}

function clearChatCache() {
  try {
    localStorage.removeItem(CACHE_STORAGE_KEY);
  } catch (e) {}
}

function getChatCacheStats() {
  const cache = getChatCache();
  let totalHits = 0;
  for (const e of cache.entries) {
    totalHits += (e.hits || 1);
  }
  return {
    totalEntries: cache.entries.length,
    totalHits,
    entries: cache.entries
  };
}

export async function askChatbot(query) {
  const trimmed = (query || '').trim();
  if (!trimmed) {
    return {
      response: 'Please enter a question about IronLog or your workout.',
      cached: false,
      hits: 0,
      inScope: true,
      source: 'none'
    };
  }

  // 1. Strict Scope Filter
  const inScope = isQueryInScope(trimmed);
  if (!inScope) {
    const cachedRefusal = findInCache(trimmed);
    if (cachedRefusal && !cachedRefusal.entry.inScope) {
      return {
        response: cachedRefusal.entry.response,
        cached: true,
        hits: cachedRefusal.entry.hits,
        similarity: Math.round(cachedRefusal.similarity * 100),
        inScope: false,
        source: 'cache'
      };
    }

    const refusal = getOutOfScopeResponse();
    putInCache(trimmed, refusal, false, 'refusal');
    return {
      response: refusal,
      cached: false,
      hits: 1,
      inScope: false,
      source: 'refusal'
    };
  }

  // 2. Immediate Identity & Greeting check
  const normQ = normalizeQuery(trimmed);
  const greetings = ['who are you', 'who r u', 'what can you do', 'hi', 'hello', 'hey', 'help', 'what are you', 'introduce yourself'];
  if (greetings.some(g => normQ === g || normQ.startsWith(g + ' ') || normQ.endsWith(' ' + g))) {
    return {
      response: `👋 **I am the IronLog AI Coach!**

I am your dedicated hypertrophy and workout training companion, grounded directly in the IronLog app and your personal training data.

Here is what I can help you with:
• **Today's Workout**: Check your scheduled split (PPL, Upper/Lower, Arnold), exercises, target sets, and reps.
• **Progressive Overload**: How IronLog calculates your next weight suggestions (+2.5 kg for compounds, +1 kg for isolations).
• **Golden-Era Proportions**: Steve Reeves & John McCallum Grecian ratio targets (1.618 V-taper, arms, neck, calves).
• **Muscle Recovery**: Recovery percentages (0–100%) and fatigue color statuses across 11 muscle groups.
• **Rest Timer & Audio**: Web Audio harmonic chime synthesis and mobile haptic vibration.
• **Cloud Sync & Offline**: Supabase backup, pgvector semantic search, and offline logging.

Ask me anything about your training, or tap one of the suggestion chips!`,
      cached: false,
      hits: 1,
      inScope: true,
      source: 'intro'
    };
  }

  // 3. Check Similarity Cache
  const cachedResult = findInCache(trimmed);
  if (cachedResult && cachedResult.entry.inScope) {
    return {
      response: cachedResult.entry.response,
      cached: true,
      hits: cachedResult.entry.hits,
      similarity: Math.round(cachedResult.similarity * 100),
      matchedQuery: cachedResult.entry.originalQuery,
      inScope: true,
      source: 'cache'
    };
  }

  // 3. RAG Retrieval Step: Retrieve relevant knowledge chunks (Supabase pgvector or local BM25)
  const aiConfig = getAiConfig();
  const retrievalResult = await retrieveHybridChunks(trimmed, aiConfig.apiKey, aiConfig.provider, 3);
  const retrievedChunks = retrievalResult.chunks;
  const userContext = buildLiveUserContext();
  const ragPrompt = buildRagPrompt(trimmed, retrievedChunks, userContext);

  // 4. Generation Step: Cloud LLM or Local RAG Engine
  let generatedResponse = '';
  let source = retrievalResult.source === 'supabase-pgvector' ? 'rag-pgvector' : 'rag-local';

  if (aiConfig.apiKey && aiConfig.apiKey.trim().length > 0) {
    try {
      generatedResponse = await callCloudLlm(ragPrompt, aiConfig);
      source = `llm-${aiConfig.provider}+${retrievalResult.source}`;
    } catch (llmErr) {
      console.warn('Cloud LLM call failed, falling back to Local RAG:', llmErr.message);
      generatedResponse = generateLocalRagResponse(trimmed, retrievedChunks);
      source = `rag-fallback+${retrievalResult.source}`;
    }
  } else {
    // Zero-dependency local RAG synthesis
    generatedResponse = generateLocalRagResponse(trimmed, retrievedChunks);
    source = `rag-local+${retrievalResult.source}`;
  }

  // 5. Store in Similarity Cache for instant future retrieval
  putInCache(trimmed, generatedResponse, true, source);

  return {
    response: generatedResponse,
    cached: false,
    hits: 1,
    inScope: true,
    source,
    retrievedChunks: retrievedChunks.map(c => c.title)
  };
}

function toggleChat(forceState = null) {

  const drawer = document.getElementById('chat-drawer');

  if (!drawer) return;

export async function sendChatMessage(customText = null) {
  const inputEl = document.getElementById('chat-input-field');
  const query = customText || (inputEl ? inputEl.value : '');
  if (!query || !query.trim()) return;

  if (inputEl && !customText) inputEl.value = '';

  const history = getChatHistory();
  const userMsg = { sender: 'user', text: query.trim(), timestamp: Date.now() };
  history.push(userMsg);
  saveChatHistory(history);
  renderMessagesList();
  scrollChatToBottom();
  showTypingIndicator();

  // Run through RAG pipeline & similarity cache
  const result = await askChatbot(query.trim());

  removeTypingIndicator();

  const botMsg = {
    sender: 'bot',
    text: result.response,
    cached: result.cached,
    hits: result.hits,
    similarity: result.similarity,
    source: result.source,
    inScope: result.inScope,
    timestamp: Date.now()
  };

  history.push(botMsg);
  saveChatHistory(history);
  renderMessagesList();
  scrollChatToBottom();
  updateCacheBadge();
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatBotMessage(text) {
  if (!text) return '';
  let formatted = escapeHtml(text);
  formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
  formatted = formatted.replace(/`([^`]+)`/g, '<code class="chat-code">$1</code>');
  formatted = formatted.replace(/\n• /g, '<br>• ');
  formatted = formatted.replace(/\n---/g, '<hr style="border:0;border-top:1px solid var(--bd);margin:8px 0">');
  formatted = formatted.replace(/\n\n/g, '<br><br>');
  formatted = formatted.replace(/\n/g, '<br>');
  return formatted;
}

        if (window.IronLog && window.IronLog.showToast) {
          window.IronLog.showToast(`Sync error: ${err.message}`);

      } finally {
        setTimeout(() => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '⚡ Sync & Embed Corpus to Supabase pgvector';
          }
        }, 3500);
      }
    },
    getStats: () => getChatCacheStats()
  };
}

/**
 * Apply theme to document
 */
function applyTheme() {
  const state = getState();
  const theme = state.theme || 'dark';
  const root = document.documentElement;

  if (theme === 'system') {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  } else {
    root.setAttribute('data-theme', theme);
  }
}

/**
 * Toast Notification
 */
function showToast(message) {
  const existing = document.querySelector('.toast-notice');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast-notice';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2600);
}

/**
 * Open Modal
 */
function openModal(htmlContent) {
  const md = $('md');
  const mb = $('mb');
  mb.innerHTML = htmlContent;
  md.style.display = 'flex';
  setTimeout(() => md.classList.add('show'), 10);
}

/**
 * Close Modal
 */
function closeModal() {
  const md = $('md');
  md.classList.remove('show');
  setTimeout(() => {
    md.style.display = 'none';
    $('mb').innerHTML = '';
  }, 200);
}

/**
 * Format date for header
 */
function getFormattedHeaderDate() {
  return new Date().toLocaleDateString(undefined, {
    weekday: 'short',
    day: 'numeric',
    month: 'short'
  });
}

/**
 * Get active workout today
 */
function getTodayWorkout() {
  const state = getState();
  const todayStr = getTodayDate();
  if (state.ov && state.ov.d === todayStr) {
    return state.ov.i < 0 ? null : WORKOUT_SPLITS[state.ov.i];
  }
  const dayIndex = (new Date().getDay() + 6) % 7; // Monday=0 ... Sunday=6
  return dayIndex > 5 ? null : WORKOUT_SPLITS[dayIndex];
}

/**
 * Daily exercise modifications list
 */
function getDailyMods() {
  const state = getState();
  const todayStr = getTodayDate();
  if (!state.x || state.x.d !== todayStr) {
    state.x = { d: todayStr, rm: [], add: [], fo: [] };
  }
  return state.x;
}

  const unit = state.wu;

  // Active workout or Check-in status

    html += `
      <div class="c">
        <div class="r sb">
          <div>
            <div class="mu-sm" style="text-transform:uppercase;font-weight:700">Scheduled Today</div>
            <h2>${todayWorkout ? todayWorkout[0] : 'Rest Day'}</h2>

              ${!isLoggedIn ? `<div class="mu-sm" style="font-size:11px;margin-top:3px">Login to check in</div>` : ''}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  // Day selector override
  const currentOverrideVal = state.ov && state.ov.d === todayStr ? state.ov.i : 'auto';
  html += `
    <div class="c" style="padding:12px 16px">
      <div class="r sb">
        <label style="margin:0">Change Workout</label>
        <select onchange="IronLog.setDayOverride(this.value)" style="width:auto;min-width:180px;padding:6px 10px">
          <option value="auto" ${currentOverrideVal === 'auto' ? 'selected' : ''}>Automatic (by weekday)</option>
          ${WORKOUT_SPLITS.map((s, idx) => `
            <option value="${idx}" ${currentOverrideVal === idx ? 'selected' : ''}>${s[0]}</option>
          `).join('')}
          <option value="-1" ${currentOverrideVal === -1 ? 'selected' : ''}>Rest Day</option>
        </select>
      </div>
    </div>
  `;

  if (todayWorkout) {

    if (state.p.g === 'f' && todayWorkout[0] === 'Legs A' && !exerciseIds.includes('ht')) {
      exerciseIds.push('ht');
    }
    // Add custom additions
    exerciseIds = exerciseIds.concat(mods.add).filter((id, pos, arr) => !mods.rm.includes(id) && arr.indexOf(id) === pos);

    const readyExercises = [];
    const recoveringExercises = [];

    exerciseIds.forEach(id => {
      const ex = allEx[id];
      if (!ex) return;
      const rec = getMuscleRecovery(ex.primary, state, allEx);
      if (rec.status === 'red' && !mods.fo.includes(id)) {
        recoveringExercises.push(id);
      } else {
        readyExercises.push(id);
      }
    });

    // Prioritize lagging muscles
    readyExercises.sort((a, b) => {
      const scoreA = getMuscleScore(allEx[a].primary, state) ?? 1;
      const scoreB = getMuscleScore(allEx[b].primary, state) ?? 1;
      return scoreA - scoreB;
    });

    // Render Ready Exercises
    readyExercises.forEach(id => {
      const ex = allEx[id];
      const targetSetsCount = getTargetSets(ex.primary, state);
      const loggedSets = state.a ? state.a.sets.filter(s => s.ex === id) : [];
      const score = getMuscleScore(ex.primary, state);
      const isPriority = (state.p.pri || []).includes(ex.primary);
      const repRange = state.p.g === 'f' ? '8–15' : '6–12';

      // Suggested weight
      const lastSuggestedKg = loggedSets.length ? loggedSets[loggedSets.length - 1].w : getSuggestedWeight(id, state, allEx);
      const suggestedDisplayVal = formatWeight(lastSuggestedKg, unit);
      const stepVal = unit === 'lbs' ? '5' : '1.25';

      html += `
        <div class="c">
          <div class="r sb">
            <h3 style="cursor:pointer" onclick="IronLog.showExerciseGuide('${id}')">${ex.name}</h3>
            <div class="r">
              <button class="g sm" onclick="IronLog.showExerciseGuide('${id}')">Guide</button>
              <button class="g sm" onclick="IronLog.skipExercise('${id}')" title="Skip this exercise">Skip</button>

          <div class="r" style="margin:6px 0;flex-wrap:wrap">
            <span class="t">${ex.primary}</span>
            ${score && score < 0.93 ? '<span class="t t-ac">Below Target (+1 set)</span>' : ''}
            ${score && score >= 1.02 ? '<span class="t">At Target (2 sets)</span>' : ''}
            ${isPriority ? '<span class="t t-ac">Priority Focus (+1 set)</span>' : ''}
          </div>

          <div class="mu-sm" style="margin-bottom:8px">
            Target: <b>${targetSetsCount} sets</b> · <b>${repRange} reps</b>
          </div>

          <!-- Logged Sets Chips -->
          <div>
            ${loggedSets.map((s, sIdx) => `
              <span class="ch">
                <b>${formatWeight(s.w, unit)} ${unit}</b> × ${s.r} reps
                ${state.a ? `<span class="del-set" onclick="IronLog.deleteSet('${id}', ${sIdx})" title="Remove set">×</span>` : ''}
              </span>
            `).join('')}
          </div>

          <!-- Active Set Logger -->
          ${state.a ? (
            loggedSets.length < targetSetsCount ? `
              <div class="r" style="margin-top:12px;align-items:flex-end">
                <div style="flex:1">
                  <label>Weight (${unit})</label>
                  <div class="input-stepper">
                    <button type="button" onclick="IronLog.stepInput('w_${id}', -${stepVal})">-</button>
                    <input id="w_${id}" type="number" step="${stepVal}" value="${suggestedDisplayVal}">
                    <button type="button" onclick="IronLog.stepInput('w_${id}', ${stepVal})">+</button>
                  </div>
                </div>
                <div style="flex:1">
                  <label>Reps</label>
                  <div class="input-stepper">
                    <button type="button" onclick="IronLog.stepInput('r_${id}', -1)">-</button>
                    <input id="r_${id}" type="number" value="10">
                    <button type="button" onclick="IronLog.stepInput('r_${id}', 1)">+</button>
                  </div>
                </div>
                <button onclick="IronLog.logSet('${id}')" style="height:42px">
                  Log Set
                </button>
              </div>
            ` : `
              <div class="r sb" style="margin-top:10px;padding-top:6px;border-top:1px dashed var(--bd)">
                <span class="t t-gn">Completed ✓ (${loggedSets.length}/${targetSetsCount} sets)</span>
                <button class="g sm" onclick="IronLog.logExtraSet('${id}')">+ Extra Set</button>
              </div>
            `
          ) : `
            <div class="mu-sm" style="margin-top:8px">Start workout above to log sets.</div>
          `}
        </div>
      `;
    });

    // Recovering Exercises Card
    if (recoveringExercises.length > 0) {
      html += `
        <div class="c" style="border-left:3px solid var(--rd)">
          <b>Omitted: Muscle Still Recovering</b>
          <div class="mu-sm">These exercises were filtered to allow adequate muscle protein synthesis & recovery (&lt; 36h).</div>

                </div>

            }).join('')}
          </div>

    // Add Any Exercise dropdown
    const availableToAdd = Object.keys(allEx).filter(i => !exerciseIds.includes(i));
    availableToAdd.sort((a, b) => (allEx[a]?.name || '').localeCompare(allEx[b]?.name || ''));

        </select>
      </div>
    `;
  }

  html += renderQuickWeightWidget();
  return html;
}

/**
 * VIEW: Weight Tracking & SVG Chart
 */
function renderWeightView() {
  const state = getState();
  const unit = state.wu;
  const weights = state.w || [];
  
  // Calculate 7-day rolling average
  const rollingAverages = weights.map((entry, idx) => {
    const window = weights.slice(Math.max(0, idx - 6), idx + 1);
    const avg = window.reduce((sum, item) => sum + item.w, 0) / window.length;
    return avg;
  });

  const recentWeights = weights.slice(-30);
  const recentAverages = rollingAverages.slice(-30);

  let html = renderHeader();
  html += renderQuickWeightWidget();

  if (recentWeights.length > 1) {
    const vals = recentWeights.map(x => unit === 'lbs' ? x.w * 2.20462 : x.w);
    const avgVals = recentAverages.map(x => unit === 'lbs' ? x * 2.20462 : x);
    const allVals = vals.concat(avgVals);
    const minVal = Math.min(...allVals) - 1.0;
    const maxVal = Math.max(...allVals) + 1.0;

    const getX = (idx) => 15 + (idx * 290) / (vals.length - 1);
    const getY = (val) => 110 - ((val - minVal) / (maxVal - minVal)) * 95;
    const pointsStr = (arr) => arr.map((y, i) => `${getX(i).toFixed(1)},${getY(y).toFixed(1)}`).join(' ');

    const diff7 = weights.length >= 2 
      ? (weights[weights.length - 1].w - weights[Math.max(0, weights.length - 8)].w)
      : 0;
    const diff7Display = formatWeight(Math.abs(diff7), unit);
    const sign = diff7 >= 0 ? '+' : '-';

    html += `
      <div class="c">
        <h3>Weight Trend (Past ${vals.length} Entries)</h3>

          <svg viewBox="0 0 320 120" style="width:100%;height:auto;overflow:visible">

            <line x1="15" y1="62" x2="305" y2="62" stroke="var(--bd)" stroke-dasharray="2 2"/>
            <line x1="15" y1="110" x2="305" y2="110" stroke="var(--bd)" stroke-dasharray="2 2"/>

            <!-- Daily Line -->
            <polyline points="${pointsStr(vals)}" fill="none" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="3 3"/>
            <!-- 7-Day Moving Avg Line -->
            <polyline points="${pointsStr(avgVals)}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Latest Point Dot -->

        </div>

      <div class="c">
        <div class="gr">
          <div>

            <h2>${formatWeight(getLatestWeight(), unit)} ${unit}</h2>
          </div>
          <div>
            <div class="mu-sm">Past 7 Entries Trend</div>
            <h2 style="color:${diff7 > 0 ? 'var(--yl)' : 'var(--gn)'}">${sign}${diff7Display} ${unit}</h2>
          </div>
        </div>
      </div>
    `;
  } else {
    html += `
      <div class="c">
        <p class="mu">Log your weight on two or more days to generate your rolling 7-day trend chart.</p>
      </div>
    `;
  }

  // Weight History Table
  if (weights.length > 0) {
    html += `
      <div class="c">
        <div class="r sb">
          <h3>Weight History</h3>
          <span class="mu-sm">${weights.length} entries</span>
